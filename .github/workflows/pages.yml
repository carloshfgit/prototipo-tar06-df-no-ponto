name: Publicar protótipo no GitHub Pages

# Só publica quando muda um arquivo que faz parte do protótipo.
# Mudanças no README, nas capturas ou em outros arquivos não disparam o deploy.
on:
  push:
    branches: [main]
    paths:
      - index.html
      - manifest.webmanifest
      - icone.svg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Separar os arquivos publicados
        run: |
          mkdir _site
          cp index.html manifest.webmanifest icone.svg _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
